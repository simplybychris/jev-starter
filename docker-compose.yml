# One app = one container, no public ports.
# The shared Caddy (deploy/caddy) reaches it as <APP_NAME>:3000 over the external "web" network.
# Never add a "ports:" section here: Caddy is the only entry point from the internet.
# Before the first start on a machine: docker network create --label jev-starter=1 web
services:
  app:
    build: .
    # Unique per app on the VPS; set APP_NAME in .env (Compose reads it from there).
    container_name: ${APP_NAME:-jev-starter}
    env_file: .env
    environment:
      PORT: "3000"
      # Midnight in this zone resets the daily budget counter.
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    labels:
      # Marks resources created by this starter, so a deploy never touches anything else.
      - jev-starter=1
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
