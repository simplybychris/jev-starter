# One app = one container, no public ports.
# The shared Caddy (deploy/caddy) reaches it as <APP_NAME>:3000 over the external "web" network.
# Before the first start on a machine: docker network create web
services:
  app:
    build: .
    # Unique per app on the VPS; set APP_NAME in .env (Compose reads it from there).
    container_name: ${APP_NAME:-jev-starter}
    env_file: .env
    environment:
      PORT: "3000"
    restart: unless-stopped
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
